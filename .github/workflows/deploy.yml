name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-web-build]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache Node Modules
        uses: actions/cache@v4
        with:
          path: web/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('web/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Node Dependencies
        working-directory: web
        run: npm ci || npm install

      - name: Build Web UI
        working-directory: web
        run: npm run build

      - name: Setup Python for PlatformIO
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare Deployment Config
        run: cp deploy/platformio.ini platformio.ini

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio
            ~/.cache/pip
          key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}-
            ${{ runner.os }}-pio-

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Install PlatformIO Packages
        run: pio pkg install -e ESP32-C6-DevKitM-1

      - name: Build Firmware
        id: pio_build
        continue-on-error: true
        run: pio run -e ESP32-C6-DevKitM-1

      - name: Fallback Clean Build
        if: steps.pio_build.outcome == 'failure'
        run: |
          echo "Cached build failed. Performing clean build..."
          rm -rf .pio
          rm -rf ~/.platformio/.cache
          pio pkg install -e ESP32-C6-DevKitM-1
          pio run -e ESP32-C6-DevKitM-1

      - name: Copy Firmware to Web Dist
        run: |
          cp .pio/build/ESP32-C6-DevKitM-1/firmware.bin web/dist/firmware.bin

      - name: Download Original Firmware (EPD13 & EPD7)
        uses: dawidd6/action-download-artifact@v3
        continue-on-error: true
        with:
          github_token: ${{secrets.GITHUB_TOKEN}}
          repo: paperlesspaper/paperlesspaper-firmware
          workflow: dev.yml
          branch: main
          name: ^epaper_fw_.*_dev_.*$
          name_is_regexp: true
          path: web/dist/downloaded_factory

      - name: Flatten Factory Firmware
        continue-on-error: true
        run: |
          mkdir -p web/dist/factory
          # Finde alle .json und .bin Dateien und kopiere sie ins factory Verzeichnis
          find web/dist/downloaded_factory -type f -name "*.json" -exec cp {} web/dist/factory/ \;
          find web/dist/downloaded_factory -type f -name "*.bin" -exec cp {} web/dist/factory/ \;
          rm -rf web/dist/downloaded_factory
          ls -la web/dist/factory/

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
