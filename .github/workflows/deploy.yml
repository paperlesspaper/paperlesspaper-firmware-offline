name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-web-build]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build_firmware:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - epd_type: 13INCH
            display_val: 1
            suffix: epd13
          - epd_type: 7INCH
            display_val: 0
            suffix: epd7
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python for PlatformIO
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare Deployment Config
        run: cp deploy/platformio.ini platformio.ini

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio
            ~/.cache/pip
          key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}-
            ${{ runner.os }}-pio-

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Install PlatformIO Packages
        run: pio pkg install -e ESP32-C6-DevKitM-1

      - name: Set Display Type
        run: |
          if [ "${{ matrix.display_val }}" = "1" ]; then
            sed -i 's/^#define EPD_TYPE_13INCH/#define EPD_TYPE_13INCH/' src/types.h
            sed -i 's|^// #define EPD_TYPE_13INCH|#define EPD_TYPE_13INCH|' src/types.h
            sed -i 's|^#define EPD_TYPE_7INCH|// #define EPD_TYPE_7INCH|' src/types.h
            sed -i 's|^// #define EPD_TYPE_7INCH|// #define EPD_TYPE_7INCH|' src/types.h
          else
            sed -i 's|^#define EPD_TYPE_13INCH|// #define EPD_TYPE_13INCH|' src/types.h
            sed -i 's|^// #define EPD_TYPE_13INCH|// #define EPD_TYPE_13INCH|' src/types.h
            sed -i 's|^#define EPD_TYPE_7INCH|#define EPD_TYPE_7INCH|' src/types.h
            sed -i 's|^// #define EPD_TYPE_7INCH|#define EPD_TYPE_7INCH|' src/types.h
          fi

      - name: Build Firmware
        id: pio_build
        continue-on-error: true
        run: pio run -e ESP32-C6-DevKitM-1

      - name: Fallback Clean Build
        if: steps.pio_build.outcome == 'failure'
        run: |
          echo "Cached build failed. Performing clean build..."
          rm -rf .pio
          rm -rf ~/.platformio/.cache
          pio pkg install -e ESP32-C6-DevKitM-1
          pio run -e ESP32-C6-DevKitM-1

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: offline_firmware_${{ matrix.suffix }}
          path: .pio/build/ESP32-C6-DevKitM-1/firmware.bin

  build_web:
    runs-on: ubuntu-latest
    needs: build_firmware
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache Node Modules
        uses: actions/cache@v4
        with:
          path: web/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('web/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Node Dependencies
        working-directory: web
        run: npm ci || npm install

      - name: Build Web UI
        working-directory: web
        run: npm run build

      - name: Download Offline Firmwares
        uses: actions/download-artifact@v4
        with:
          path: downloaded_offline

      - name: Move Offline Firmwares to Dist
        run: |
          mv downloaded_offline/offline_firmware_epd13/firmware.bin web/dist/firmware_offline_epd13.bin
          mv downloaded_offline/offline_firmware_epd7/firmware.bin web/dist/firmware_offline_epd7.bin
          rm -rf downloaded_offline

      - name: Assemble Factory OTA Assets from Local Firmware
        run: |
          mkdir -p web/dist/factory
          cp web/dist/firmware_offline_epd7.bin web/dist/factory/firmware_epd7_pre.bin
          cp web/dist/firmware_offline_epd13.bin web/dist/factory/firmware_epd13_pre.bin
          cp web/dist/firmware_offline_epd7.bin web/dist/factory/firmware_epd7.bin
          cp web/dist/firmware_offline_epd13.bin web/dist/factory/firmware_epd13.bin

          FW_VERSION="${GITHUB_SHA::7}"
          FW_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          cat > web/dist/factory/espfota_epd7_pre.json <<EOF
          {"version":"${FW_VERSION}","date":"${FW_DATE}","url":"./factory/firmware_epd7_pre.bin"}
          EOF
          cat > web/dist/factory/espfota_epd13_pre.json <<EOF
          {"version":"${FW_VERSION}","date":"${FW_DATE}","url":"./factory/firmware_epd13_pre.bin"}
          EOF
          cat > web/dist/factory/espfota_epd7.json <<EOF
          {"version":"${FW_VERSION}","date":"${FW_DATE}","url":"./factory/firmware_epd7.bin"}
          EOF
          cat > web/dist/factory/espfota_epd13.json <<EOF
          {"version":"${FW_VERSION}","date":"${FW_DATE}","url":"./factory/firmware_epd13.bin"}
          EOF

          ls -la web/dist/factory/

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build_web
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
