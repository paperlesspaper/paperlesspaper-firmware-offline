name: Build and Deploy

# Publishes two release channels to GitHub Pages:
#   main -> site root   (stable web UI + offline firmware of main)
#   dev  -> ./dev/      (preview web UI + offline firmware of dev)
# The web UI switches between them (version button in the header), so there is one entry URL.
#
# What a run does:
#   * Only the branch that triggered the run is built.
#   * Its firmware is built once, by the hardware test (hil-test.yml). The files that passed the
#     test are the files that get published - there is no second, untested build.
#   * Every run has its own firmware version (0.1.<run number>). The web UI of the run expects
#     exactly that version.
#   * GitHub Pages holds one site per repository and every deployment replaces all of it, so the
#     other channel is taken over unchanged from the last deployment (its "site_<channel>"
#     artifact). A channel therefore only changes through its own run and its own hardware test.
#     Fallback if that artifact is missing or expired: the other channel is rebuilt from the
#     commit and with the version of its last successful deployment.
#
# One-time repository setting: Settings -> Environments -> github-pages -> Deployment branches
# must allow "dev" in addition to "main", otherwise the deploy job of a dev run is rejected.

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-web-build]

# Least privilege: only the deploy job may publish to GitHub Pages (see there).
permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Decides the firmware version of this run and where the other channel comes from.
  plan:
    name: "Plan channels"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # look up the last deployment and its artifacts
    outputs:
      fw_version: ${{ steps.resolve.outputs.fw_version }} # version of the firmware built and tested in this run
      web: ${{ steps.resolve.outputs.web }} # web UIs to build: this channel (+ the other one in the fallback case)
      rebuild_firmware: ${{ steps.resolve.outputs.rebuild_firmware }} # fallback only, otherwise []
      reuse_run: ${{ steps.resolve.outputs.reuse_run }} # run id that holds the other channel, or empty
      other_channel: ${{ steps.resolve.outputs.other_channel }}
    steps:
      - name: Resolve version and channels
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          THIS_BRANCH: ${{ github.ref_name }}
          THIS_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail

          case "$THIS_BRANCH" in
            main) other=dev ;;
            dev)  other=main ;;
            *)
              echo "::error::Deployments run only from main or dev (got '$THIS_BRANCH')."
              exit 1
              ;;
          esac

          # One version per run, shared by main and dev: it grows with every deployment.
          fw_version="0.1.$RUN_NUMBER"

          # Preferred: take the other channel over from the last deployment. Every successful run
          # keeps both channels as artifacts (site_main, site_dev), whatever branch it ran on.
          reuse_run=""
          other_sha=""
          other_version=""
          last_run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy.yml \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$last_run" ]; then
            artifact_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$last_run/artifacts?per_page=100" \
              --jq "[.artifacts[] | select(.name == \"site_$other\" and (.expired | not))][0].id // empty")
            if [ -n "$artifact_id" ]; then
              reuse_run=$last_run
              echo "::notice::'$other' is taken over from the last deployment (run $last_run), not rebuilt."
            fi
          fi

          if [ -z "$reuse_run" ]; then
            # Fallback: rebuild the other channel from the commit of its last successful deployment,
            # with the version that deployment had.
            other_sha=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy.yml \
              --branch "$other" --status success --limit 1 --json headSha --jq '.[0].headSha // empty')
            other_number=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy.yml \
              --branch "$other" --status success --limit 1 --json number --jq '.[0].number // empty')
            if [ -n "$other_number" ]; then
              other_version="0.1.$other_number"
            fi

            if [ -z "$other_sha" ] && [ "$other" = "main" ]; then
              # The site root must never be empty: fall back to the head of main (version of src/types.h).
              other_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
              echo "::warning::No successful deployment of main found, using its head ($other_sha)."
            fi
            if [ -z "$other_sha" ]; then
              echo "::notice::No successful deployment of '$other' yet: publishing '$THIS_BRANCH' only."
            else
              echo "::notice::No reusable artifact of '$other': rebuilding it from $other_sha."
            fi
          fi

          web=$(jq -cn --arg channel "$THIS_BRANCH" --arg ref "$THIS_SHA" --arg version "$fw_version" \
            '[{channel: $channel, ref: $ref, version: $version}]')
          rebuild_firmware='[]'
          if [ -n "$other_sha" ]; then
            web=$(jq -cn --argjson web "$web" --arg channel "$other" --arg ref "$other_sha" --arg version "$other_version" \
              '$web + [{channel: $channel, ref: $ref, version: $version}]')
            rebuild_firmware=$(jq -cn --arg channel "$other" --arg ref "$other_sha" --arg version "$other_version" \
              '[("epd13", "epd7") as $target | {channel: $channel, ref: $ref, version: $version, target: $target}]')
          fi

          {
            echo "fw_version=$fw_version"
            echo "web=$web"
            echo "rebuild_firmware=$rebuild_firmware"
            echo "reuse_run=$reuse_run"
            echo "other_channel=$other"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Channels in this deployment"
            echo "- **$THIS_BRANCH**: built from \`$THIS_SHA\`, firmware **v$fw_version** (the files the hardware test ran with)"
            if [ -n "$reuse_run" ]; then
              echo "- **$other**: taken over unchanged from run $reuse_run"
            elif [ -n "$other_sha" ]; then
              echo "- **$other**: rebuilt from \`$other_sha\` (no reusable artifact)"
            else
              echo "- **$other**: not deployed yet"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Gate: nothing is published unless risk analysis and hardware test pass for this commit.
  # It also builds the firmware of this run (artifacts hil_firmware_epd7 / hil_firmware_epd13).
  hil:
    name: "HIL gate"
    needs: plan
    uses: ./.github/workflows/hil-test.yml
    with:
      fw_version: ${{ needs.plan.outputs.fw_version }}
    secrets: inherit

  # Web UI per channel. Runs next to the hardware test; the firmware is added in "publish".
  build_web:
    name: "Web UI ${{ matrix.channel }}"
    runs-on: ubuntu-latest
    needs: plan
    strategy:
      matrix:
        include: ${{ fromJson(needs.plan.outputs.web) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache Node Modules
        uses: actions/cache@v4
        with:
          path: web/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('web/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Node Dependencies
        working-directory: web
        run: npm ci  # only the versions of package-lock.json, no fallback that ignores it

      - name: Build Web UI
        working-directory: web
        env:
          RELEASE_CHANNEL: ${{ matrix.channel }} # see web/vite.config.js
          BUILD_COMMIT: ${{ matrix.ref }}
          FW_VERSION: ${{ matrix.version }} # firmware version this UI expects; empty = src/types.h
        run: npm run build

      # Read by the web UI of the other channel: is this channel deployed, and which build is it?
      - name: Write channel.json
        env:
          CHANNEL: ${{ matrix.channel }}
          COMMIT: ${{ matrix.ref }}
          FW_VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          fw_version="$FW_VERSION"
          if [ -z "$fw_version" ]; then
            fw_version=$(sed -nE 's/^#define[[:space:]]+SOFTWARE_VERSION[[:space:]]+"([^"]+)".*/\1/p' src/types.h | head -n 1)
          fi
          jq -n --arg channel "$CHANNEL" --arg commit "$COMMIT" --arg fwVersion "$fw_version" \
            --arg builtAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{channel: $channel, commit: $commit, fwVersion: $fwVersion, builtAt: $builtAt}' > web/dist/channel.json
          cat web/dist/channel.json

      - name: Upload Web UI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web_${{ matrix.channel }}
          path: web/dist

  # Fallback only (see "plan"): rebuilds the firmware of the other channel when its site could
  # not be taken over. Normally this job is skipped.
  build_firmware:
    name: "Firmware ${{ matrix.channel }}/${{ matrix.target }} (rebuild)"
    runs-on: ubuntu-latest
    needs: plan
    if: needs.plan.outputs.rebuild_firmware != '[]'
    strategy:
      matrix:
        include: ${{ fromJson(needs.plan.outputs.rebuild_firmware) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}

      - name: Setup Python for PlatformIO
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare Deployment Config
        run: cp deploy/platformio.ini platformio.ini

      - name: Set version
        if: matrix.version != ''
        env:
          FW_VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          sed -i -E "s/^(#define[[:space:]]+SOFTWARE_VERSION[[:space:]]+)\"[^\"]*\"/\1\"$FW_VERSION\"/" src/types.h
          grep -q "\"$FW_VERSION\"" src/types.h

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio
            ~/.cache/pip
          key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}-
            ${{ runner.os }}-pio-

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Install PlatformIO Packages
        run: pio pkg install -e ${{ matrix.target }}

      - name: Build Firmware
        id: pio_build
        continue-on-error: true
        run: pio run -e ${{ matrix.target }}

      - name: Fallback Clean Build
        if: steps.pio_build.outcome == 'failure'
        run: |
          echo "Cached build failed. Performing clean build..."
          rm -rf .pio
          rm -rf ~/.platformio/.cache
          pio pkg install -e ${{ matrix.target }}
          pio run -e ${{ matrix.target }}

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: offline_firmware_${{ matrix.channel }}_${{ matrix.target }}
          path: .pio/build/${{ matrix.target }}/firmware.bin

  # Puts web UI and tested firmware together and assembles main (root) and dev (./dev/) into
  # the one site that GitHub Pages serves.
  publish:
    name: "Assemble site"
    runs-on: ubuntu-latest
    needs: [plan, hil, build_web, build_firmware]
    # Explicit conditions: build_firmware is normally skipped, and a skipped dependency would
    # otherwise skip this job as well. The hardware test must have passed.
    if: >-
      ${{ !cancelled()
      && needs.plan.result == 'success'
      && needs.hil.result == 'success'
      && needs.build_web.result == 'success'
      && (needs.build_firmware.result == 'success' || needs.build_firmware.result == 'skipped') }}
    permissions:
      actions: read # download the other channel from the last deployment
    steps:
      # -> built/web_main and/or built/web_dev
      - name: Download the web UIs built in this run
        uses: actions/download-artifact@v4
        with:
          pattern: web_*
          path: built

      # -> fw/hil_firmware_epd7/firmware.bin, fw/hil_firmware_epd13/firmware.bin
      - name: Download the firmware the hardware test ran with
        uses: actions/download-artifact@v8
        with:
          pattern: hil_firmware_*
          path: fw

      # -> fw/offline_firmware_<channel>_<target>/firmware.bin
      - name: Download the rebuilt firmware of the other channel (fallback)
        if: needs.plan.outputs.rebuild_firmware != '[]'
        uses: actions/download-artifact@v4
        with:
          pattern: offline_firmware_*
          path: fw

      - name: Put web UI and firmware together
        env:
          THIS_CHANNEL: ${{ github.ref_name }}
          OTHER_CHANNEL: ${{ needs.plan.outputs.other_channel }}
        run: |
          set -euo pipefail

          # Guard: should a single artifact ever be extracted without its own folder, restore it.
          if [ -f built/index.html ]; then
            mkdir -p "built/web_$THIS_CHANNEL"
            find built -mindepth 1 -maxdepth 1 ! -name 'web_*' ! -name 'site_*' -exec mv {} "built/web_$THIS_CHANNEL/" \;
          fi

          # This channel: the web UI of this commit plus exactly the files that passed the test.
          if [ ! -f "built/web_$THIS_CHANNEL/index.html" ]; then
            echo "::error::Web UI of '$THIS_CHANNEL' is missing."
            exit 1
          fi
          mv "built/web_$THIS_CHANNEL" "built/site_$THIS_CHANNEL"
          for target in epd7 epd13; do
            tested="fw/hil_firmware_$target/firmware.bin"
            if [ ! -s "$tested" ]; then
              echo "::error::Tested firmware for $target is missing ($tested)."
              exit 1
            fi
            cp "$tested" "built/site_$THIS_CHANNEL/firmware_offline_$target.bin"
          done

          # Fallback: the other channel was rebuilt in this run.
          if [ -f "built/web_$OTHER_CHANNEL/index.html" ]; then
            mv "built/web_$OTHER_CHANNEL" "built/site_$OTHER_CHANNEL"
            for target in epd7 epd13; do
              rebuilt="fw/offline_firmware_${OTHER_CHANNEL}_$target/firmware.bin"
              if [ ! -s "$rebuilt" ]; then
                echo "::error::Rebuilt firmware for $OTHER_CHANNEL/$target is missing ($rebuilt)."
                exit 1
              fi
              cp "$rebuilt" "built/site_$OTHER_CHANNEL/firmware_offline_$target.bin"
            done
          fi

          ls -la built built/site_*

      - name: Take over the other channel from the last deployment
        if: needs.plan.outputs.reuse_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ needs.plan.outputs.reuse_run }}
          CHANNEL: ${{ needs.plan.outputs.other_channel }}
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "site_$CHANNEL" --dir "built/site_$CHANNEL"
          if [ ! -f "built/site_$CHANNEL/index.html" ]; then
            echo "::error::Artifact site_$CHANNEL of run $RUN_ID has no index.html."
            exit 1
          fi
          echo "Taken over from run $RUN_ID:"
          cat "built/site_$CHANNEL/channel.json" || true

      # Every successful run holds both complete channels, so the next run can take over from it.
      - name: Keep the main site for the next run
        uses: actions/upload-artifact@v4
        with:
          name: site_main
          path: built/site_main
          if-no-files-found: error # the site root must exist
          overwrite: true # a re-run of this job uploads it again

      - name: Keep the dev site for the next run
        uses: actions/upload-artifact@v4
        with:
          name: site_dev
          path: built/site_dev
          if-no-files-found: ignore # dev may not be deployed yet
          overwrite: true

      - name: Assemble main (root) and dev (./dev/)
        run: |
          set -euo pipefail
          if [ ! -f built/site_main/index.html ]; then
            echo "::error::The main site is missing: the site root would be empty."
            exit 1
          fi
          mv built/site_main site
          if [ -f built/site_dev/index.html ]; then
            mv built/site_dev site/dev
          fi

      - name: Download Original Firmware from S3
        run: |
          mkdir -p site/factory
          # Pre-release versions (main branch, deploy_pre)
          curl -L -o site/factory/espfota_epd7_pre.json http://ul.epaperframe.de/espfota_epd7_pre.json
          curl -L -o site/factory/firmware_epd7_pre.bin http://ul.epaperframe.de/firmware_epd7_pre.bin
          curl -L -o site/factory/espfota_epd13_pre.json http://ul.epaperframe.de/espfota_epd13_pre.json
          curl -L -o site/factory/firmware_epd13_pre.bin http://ul.epaperframe.de/firmware_epd13_pre.bin
          # Release versions (main branch, approved)
          curl -L -o site/factory/espfota_epd7.json http://ul.epaperframe.de/espfota_epd7.json
          curl -L -o site/factory/firmware_epd7.bin http://ul.epaperframe.de/firmware_epd7.bin
          curl -L -o site/factory/espfota_epd13.json http://ul.epaperframe.de/espfota_epd13.json
          curl -L -o site/factory/firmware_epd13.bin http://ul.epaperframe.de/firmware_epd13.bin
          # The dev UI loads ./factory/ relative to its own folder.
          if [ -f site/dev/index.html ]; then
            cp -r site/factory site/dev/factory
          fi
          ls -la site site/factory
          if [ -d site/dev ]; then ls -la site/dev; fi

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: publish
    # Explicit, because a skipped job further up (build_firmware) would otherwise skip this one too.
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
