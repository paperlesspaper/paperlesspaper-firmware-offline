name: "HIL Hardware Test"
run-name: "HIL Test 0.1.${{ github.run_number }} (${{ github.ref_name }})"

# Runs on the self-hosted hardware runner. This repository is public:
# never add a pull_request trigger here, it would run foreign code on that machine.
#
# No push trigger of its own: deploy.yml runs on every push to main and dev and calls this
# workflow as its gate. A second trigger here would run the hardware test twice per dev push.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Test hardware"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - epd7
          - epd13
  # Called by deploy.yml: main and dev are only deployed after the hardware test passed.
  # deploy.yml publishes the firmware built here (artifacts hil_firmware_epd7 / hil_firmware_epd13),
  # so the files that are tested are the files that are released.
  workflow_call:
    inputs:
      target:
        type: string
        default: "all"
      fw_version:
        description: "Version to build into the firmware. Empty: 0.1.<run number>."
        type: string
        default: ""

permissions:
  contents: read

# One run at a time. Never cancel a run: it may be flashing a device over BLE.
# The group is per calling workflow: a queued deployment must not be replaced by a dev run.
concurrency:
  group: hil-offline-${{ github.workflow }}
  cancel-in-progress: false

env:
  # deploy.yml passes the version of its run; a manual run of this workflow numbers itself.
  FW_VERSION: ${{ inputs.fw_version || format('0.1.{0}', github.run_number) }}
  # Branch of paperlesspaper-firmware that provides the shared hardware layer (testbench/)
  CLOUD_TESTBENCH_REF: ${{ vars.CLOUD_TESTBENCH_REF || 'paper-l' }}

jobs:
  pre_flight:
    name: "Pre-Flight & Risk Analysis"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # Compares against the state before the push, so every commit of the push is covered.
      # A HIGH rating stops the run before anything is flashed.
      - name: AI Firmware Risk Analysis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          DIFF_BASE: ${{ github.event.before }}
        run: python tools/ai_risk_analysis.py --base "$DIFF_BASE" --output risk_report.md

      - name: Upload risk report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hil_risk_report
          path: risk_report.md
          if-no-files-found: ignore

  build:
    name: "Build ${{ matrix.target }}"
    runs-on: ubuntu-latest
    needs: pre_flight
    strategy:
      matrix:
        target: [epd7, epd13]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            .pio
          key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}-
            ${{ runner.os }}-pio-

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Set version
        run: |
          cp deploy/platformio.ini platformio.ini
          sed -i -e 's/#define SOFTWARE_VERSION "0.1.0"/#define SOFTWARE_VERSION "${{ env.FW_VERSION }}"/' src/types.h
          grep -q '"${{ env.FW_VERSION }}"' src/types.h

      - name: Build firmware
        run: |
          if ! pio run -e ${{ matrix.target }}; then
            echo "::warning::Build with cache failed. Retrying clean build..."
            rm -rf .pio
            pio run -e ${{ matrix.target }}
          fi

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: hil_firmware_${{ matrix.target }}
          path: .pio/build/${{ matrix.target }}/firmware.bin
          if-no-files-found: error

  # Web UI in a headless browser against a simulated device (webtest/). Also builds the web UI
  # the hardware jobs use, with the firmware version of this run.
  web:
    name: "Web UI test"
    runs-on: ubuntu-latest
    needs: pre_flight
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web UI
        working-directory: web
        env:
          FW_VERSION: ${{ env.FW_VERSION }} # see web/vite.config.js
        run: |
          npm ci
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          pip install -r webtest/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run web UI tests
        run: python -m pytest webtest -v -p no:cacheprovider --junitxml=junit_web.xml

      # Same result format as the hardware jobs, so the test protocol lists the web UI tests too.
      - name: Write result file
        if: always()
        run: python -m hil.results junit_web.xml hil_result_web.json web

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hil_result_web
          path: hil_result_web.json
          if-no-files-found: ignore

      - name: Upload web UI for the hardware jobs
        uses: actions/upload-artifact@v7
        with:
          name: hil_web
          path: web/dist
          if-no-files-found: error

  hil_epd7:
    name: "HIL Test: EPD7"
    runs-on: [self-hosted, Windows, hil-testbench]
    needs: [build, web]
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'epd7'
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Checkout cloud testbench (hardware layer)
        uses: actions/checkout@v7
        with:
          repository: paperlesspaper/paperlesspaper-firmware
          ref: ${{ env.CLOUD_TESTBENCH_REF }}
          path: _cloud
          sparse-checkout: testbench
          persist-credentials: false

      - name: Install dependencies
        run: pip install -r hil/requirements.txt

      - name: Download firmware
        uses: actions/download-artifact@v8
        with:
          name: hil_firmware_epd7
          path: build_artifact_epd7

      - name: Download web UI
        uses: actions/download-artifact@v8
        with:
          name: hil_web
          path: web/dist

      - name: Install browser for the web UI tests
        run: python -m playwright install chromium

      - name: Run EPD7 HIL test
        env:
          CLOUD_TESTBENCH_ROOT: "${{ github.workspace }}/_cloud"
          HIL_WIFI_SSID: ${{ secrets.HIL_WIFI_SSID }}
          HIL_WIFI_PASSWORD: ${{ secrets.HIL_WIFI_PASSWORD }}
        run: >
          python -m hil.run --target epd7
          --candidate-bin build_artifact_epd7/firmware.bin
          --candidate-version ${{ env.FW_VERSION }}
          --results hil_result_epd7.json -v

      # Only the masked result file is uploaded, never the raw JUnit file (see hil/results.py).
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hil_result_epd7
          path: hil_result_epd7.json
          if-no-files-found: ignore

  hil_epd13:
    name: "HIL Test: EPD13"
    runs-on: [self-hosted, Windows, hil-testbench]
    # Strictly after EPD7: both devices share the host's COM ports, relays and Bluetooth.
    needs: [build, web, hil_epd7]
    if: >
      always() && needs.build.result == 'success' && needs.web.result == 'success' &&
      (needs.hil_epd7.result == 'success' || needs.hil_epd7.result == 'skipped') &&
      (github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'epd13')
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Checkout cloud testbench (hardware layer)
        uses: actions/checkout@v7
        with:
          repository: paperlesspaper/paperlesspaper-firmware
          ref: ${{ env.CLOUD_TESTBENCH_REF }}
          path: _cloud
          sparse-checkout: testbench
          persist-credentials: false

      - name: Install dependencies
        run: pip install -r hil/requirements.txt

      - name: Download firmware
        uses: actions/download-artifact@v8
        with:
          name: hil_firmware_epd13
          path: build_artifact_epd13

      - name: Download web UI
        uses: actions/download-artifact@v8
        with:
          name: hil_web
          path: web/dist

      - name: Install browser for the web UI tests
        run: python -m playwright install chromium

      - name: Run EPD13 HIL test
        env:
          CLOUD_TESTBENCH_ROOT: "${{ github.workspace }}/_cloud"
          HIL_WIFI_SSID: ${{ secrets.HIL_WIFI_SSID }}
          HIL_WIFI_PASSWORD: ${{ secrets.HIL_WIFI_PASSWORD }}
        run: >
          python -m hil.run --target epd13
          --candidate-bin build_artifact_epd13/firmware.bin
          --candidate-version ${{ env.FW_VERSION }}
          --results hil_result_epd13.json -v

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hil_result_epd13
          path: hil_result_epd13.json
          if-no-files-found: ignore

  report:
    name: "Test protocol"
    runs-on: ubuntu-latest
    needs: [pre_flight, build, web, hil_epd7, hil_epd13]
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Download results
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: hil_result_*
          path: results
          merge-multiple: true

      - name: Download risk report
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: hil_risk_report
          path: results

      - name: Generate test protocol
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: >
          python hil/report.py results/hil_result_web.json results/hil_result_epd7.json results/hil_result_epd13.json
          --risk-report results/risk_report.md
          --fw-version "$FW_VERSION" --commit "$GITHUB_SHA"
          --output-md hil_test_protocol.md --output-json hil_test_protocol.json
          >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test protocol
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hil_test_protocol
          path: |
            hil_test_protocol.md
            hil_test_protocol.json
          if-no-files-found: ignore

      - name: Enforce result
        if: always()
        run: |
          for result in "${{ needs.pre_flight.result }}" "${{ needs.build.result }}" "${{ needs.web.result }}" "${{ needs.hil_epd7.result }}" "${{ needs.hil_epd13.result }}"; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "::error::Risk analysis, build, web UI test or hardware test did not pass ($result)."
              exit 1
            fi
          done
