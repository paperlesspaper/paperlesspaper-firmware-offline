; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:ESP32-C6-DevKitM-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
framework = arduino
board = esp32-c6-devkitm-1
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = part.csv
extra_scripts = pre:set_env.py
lib_ignore = 
	BLE
	BluetoothSerial
	SimpleBLE
	WiFiProv
lib_deps = 
	https://github.com/smarthomeagentur/GxEPD2.git
	https://github.com/smarthomeagentur/SerialFlash.git
	adafruit/Adafruit GFX Library@^1.11.11
	bblanchon/ArduinoJson@^7.3.0
	olikraus/U8g2_for_Adafruit_GFX@^1.8.0
	ldab/KXTJ3-1057@^0.1.1
	h2zero/NimBLE-Arduino@^2.3.4
	ricmoo/QRCode@^0.0.1
	bitbank2/JPEGDEC@^1.8.4
	greiman/SdFat @ ^2.2.2
